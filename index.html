<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251c">
<title>KUHSTALL: AUSBRUCH 2026</title>
<!-- DESIGN: Farben, Abstände und Schriften -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top"><span>🐮 WICHTELN IM KUHSTALL · JUBILÄUM 2026</span><span class="pill">30 MIN</span></div>
  <div id="app"></div>
  <div class="foot">Ein Fairplay-Partyspiel. Kein Backend, keine Accounts. Punkte und Status bleiben auf diesem Gerät. Alkohol ist optional; alkoholfreie Getränke oder Ersatzaufgaben sind gleichwertig.</div>
</main>
<div id="toast"></div>

<!-- QR-Code-Bibliothek: Wird über das Internet geladen. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
/*
============================================================
🐮 KUHSTALL – HIER ÄNDERST DU DIE MISSIONEN
============================================================
1. Suche unten nach "cow:" für Stallbewohner,
   "detective:" für Detektive oder "virus:" für Patient Null.
2. Neue Mission: ['Mein neuer Auftrag', 100],
3. Zwischen Einträgen muss ein Komma stehen.
4. Datei speichern und auf GitHub hochladen.

Die Punkte werden bereits automatisch pro Spieler auf dessen
Handy gespeichert. Es gibt keine gemeinsame Online-Rangliste.
============================================================
*/
// 🐮 HIER KANNST DU DIE SPIELINHALTE ÄNDERN.
// Alles zwischen Anführungszeichen ist der Missionstext.
// Die Zahl dahinter sind die Kuhpunkte.
// Wichtig: Zwischen zwei Missionen steht ein Komma.
// Die letzte Mission einer Liste braucht kein Komma.
//
// Beispiel für eine zusätzliche Mission:
// ['Bringe jemanden dazu, laut MUH zu rufen.', 100],
//
// cow = Stallbewohner, detective = Detektiv, virus = Infizierte.
const tasks={
    // 🐮 Missionen der Stallbewohner
    cow: [
        ['Erfinde mit jemandem einen neuen Kuhstall-Spitznamen.',75],
        ['Bring jemanden dazu, freiwillig „Euter“ in einem Satz zu sagen.',100],
        ['Überzeuge zwei Personen, für 30 Sekunden nur im Dialekt zu sprechen.',125],
        ['Finde jemanden, der mit dir einen 10-Sekunden-Stallschlager singt.',100],
        ['Erhalte von drei Leuten ein High Five.',75],
        ['Lass dir einen absurden Kuhwitz erzählen.',75],
        ['Sammle drei unterschiedliche Kuhstall-Geräusche.',100],
        ['Bring eine Person dazu, einen Traktor pantomimisch darzustellen.',100]
    ],
    // 🕵️ Missionen der Detektive
    detective: [
        ['Frage drei Personen, wen sie für verdächtig halten.',100],
        ['Notiere dir zwei auffällige Gesprächssituationen.',75],
        ['Finde jemanden, der sich auffällig für QR-Codes interessiert.',75],
        ['Lass dir von zwei Personen ein Alibi für die letzten Minuten geben.',100],
        ['Bringe jemanden dazu, seine eigene Unschuld zu verteidigen.',100],
        ['Sammle drei verschiedene Verdächtigungen.',100]
    ],
    // 🦠 Missionen von Patient Null und Infizierten
    virus: [
        ['Bringe eine Person dazu, mit dir „Auf den Kuhstall!“ zu sagen.',100],
        ['Lass dir freiwillig einen neuen Kuhnamen geben.',100],
        ['Überzeuge jemanden, mit dir einen Kuhstall-Handshake zu machen.',100],
        ['Bring jemanden dazu, vor dir ein Kuhgeräusch nachzumachen.',100],
        ['Lass jemanden mit dir gemeinsam einen 5-Sekunden-Schlachtruf rufen.',125],
        ['Bringe jemanden dazu, dir ein High Five zu geben.',75]
    ]
};
// 🏅 Olympiade-Aufgaben (Name, Beschreibung)
const olympics = [
    ['MUH-BATTLE','Fordere eine Person heraus. Wer macht das überzeugendste Kuhgeräusch? Die Umstehenden entscheiden.'],
    ['STALL-PANTOMIME','Stelle einen Traktor dar, ohne zu sprechen. Jemand muss ihn erraten.'],
    ['WERBESPOT','Erfindet zu zweit eine 15-Sekunden-Werbung für einen imaginären Kuhstall-Energydrink.'],
    ['STALL-HYMNE','Komponiere mit zwei anderen einen 10-Sekunden-Schlachtruf.'],
    ['KÜHE IN ZEITLUPE','Fordere jemanden zu einem 15-Sekunden-Zeitlupen-Kuhgang heraus.']
];
// Diese Zuordnung hält die Missionslisten für die Spiellogik bereit.
window.KUHSTALL_INHALTE = {
    tasks,
    olympics 
};
/*
============================================================
🔒 SPIELLOGIK – AB HIER NORMALERWEISE NICHT BEARBEITEN
============================================================
*/
'use strict';
const $=s=>document.querySelector(s),
app=$('#app'),
KEY='kuhstall2026-player',
HOST='kuhstall2026-host';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const pack=o=>{
    const bytes=new TextEncoder().encode(JSON.stringify(o));
    let b='';
    bytes.forEach(x=>b+=String.fromCharCode(x));
    return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
};
const unpack=s=>{
    const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))
};
const get=(k)=>{
    try{
        return JSON.parse(localStorage.getItem(k))
    }catch{
        return null
    }
},
save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const toast=s=>{
    let e=$('#toast');
    e.textContent=s;
    e.style.display='block';
    setTimeout(()=>e.style.display='none',2600)
};
const roles={
    cow:{
        label:'STALLBEWOHNER',
        icon:'🐮',
        desc:'Erledige Missionen und finde die ursprünglichen Infizierten.'
    },
    detective:{
        label:'STALL-DETEKTIV',
        icon:'🕵️',
        desc:'Beobachte auffällige Spieler und enttarne Patient Null.'
    },
    virus:{
        label:'PATIENT NULL',
        icon:'🦠',
        desc:'Du startest infiziert. Erfülle Infektionsmissionen und verbreite den MUH-Virus.'
    }
};
// Spielinhalte stehen getrennt in missionen.js.
// tasks und olympics sind oben im bearbeitbaren Missionsbereich definiert.
let player=get(KEY),
host=get(HOST),
selectedVote=[];
// Zeigt die Startseite und verbindet die Buttons mit ihren Aktionen.

// Zeigt die Startseite und verbindet die Buttons mit ihren Aktionen.
function landing(){
    app.innerHTML=`<h1>🚨 KUHSTALL:<br>AUSBRUCH 2026</h1><p class="lead">30 Minuten. Geheime Rollen. Verrückte Missionen. Ein mysteriöser MUH-Virus.</p><div class="panel"><h2>Willkommen im Sperrgebiet</h2><p>Mindestens eine Person verbreitet den Virus. Erledigt Aufgaben, scannt Infektionscodes und enttarnt die ursprünglichen Übeltäter, bevor die Jubiläumsfeier eröffnet wird.</p><button class="btn" id="join">🎟️ Spielcode eingeben</button><button class="btn secondary" id="setup">⚙️ Spielleitung: Runde vorbereiten</button>${player?'<button class="btn secondary" id="resume">📱 Meine Runde fortsetzen</button>':''}</div><p class="muted">5–10 Personen · Alle mit eigenem Handy · Ohne Backend · Keine App nötig</p>`;
    $('#join').onclick=joinForm;
    $('#setup').onclick=hostForm;
    if($('#resume'))$('#resume').onclick=()=>renderPlayer()
}

// Erstellt das Formular für die Spielleitung und verteilt die geheimen Rollen.
function hostForm(){
    app.innerHTML=`<h1>⚙️ Stallmeister</h1><div class="panel"><h2>Neue Runde vorbereiten</h2><label>Teilnehmerzahl</label><select id="count">${Array.from({length:6},(_,i)=>`<option value="${i+5}" ${
        i===3?'selected':''
    }>${
        i+5
    } Personen</option>`).join('')}</select><label>Start in wie vielen Minuten?</label><select id="delay"><option value="2">2 Minuten</option><option value="5" selected>5 Minuten</option><option value="10">10 Minuten</option><option value="15">15 Minuten</option></select><p class="muted">Jeder erhält einen individuellen Link. Bitte mische die Codekarten und verteile genau eine pro Person. Die Spielleitung darf selbst mitspielen, sollte dann aber die Rollenliste nicht lesen.</p><button class="btn" id="create">🐮 Runde erstellen</button><button class="btn secondary" id="back">Zurück</button></div>`;$('#back').onclick=landing;$('#create').onclick=()=>{let n=+$('#count').value,start=Date.now()+Number($('#delay').value)*60000;let r=n>=8?['virus','virus','detective','detective']:['virus','detective'];while(r.length<n)r.push('cow');for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}let id=Math.random().toString(36).slice(2,9).toUpperCase();host={id,start,slots:r.map((role,i)=>({id:'KUH-'+String(i+1).padStart(2,'0'),role,secret:Math.random().toString(36).slice(2,10)}))};save(HOST,host);renderHost()}}

// Liefert die Seitenadresse ohne QR-Code-Zusatz (#...).
function base(){
        return location.href.split('#')[0].split('?')[0]
    }

// Baut den persönlichen Einladungslink für einen Spieler.
function playerUrl(s){
        return base()+'#join='+pack({
            v:1,room:host.id,start:host.start,n:host.slots.length,id:s.id,role:s.role,secret:s.secret
        })
    }

// Zeigt der Spielleitung die persönlichen Links und QR-Codes.
function renderHost(){
        if(!host)return hostForm();
        app.innerHTML=`<h1>📋 Spielleitung</h1><div class="panel"><h2>Runde ${esc(host.id)}</h2><p>Spielstart: <b>${new Date(host.start).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}</b> · Ende: <b>${new Date(host.start+30*60000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</b></p><p class="muted">Die folgenden Links enthalten geheime Rollen. Bitte jeweils nur der vorgesehenen Person zeigen. Jeder Link darf nur einmal verteilt werden.</p><div id="links">${host.slots.map((s,i)=>`<div class="codeitem"><b>Umschlag ${i+1}</b> · ${esc(s.id)}<button class="btn secondary" data-copy="${i}">🔗 Persönlichen Link kopieren</button><details><summary>Link / QR-Code anzeigen</summary><div id="qr${i}" class="qr"></div><a href="${esc(playerUrl(s))}">${esc(playerUrl(s))}</a></details></div>`).join('')}</div><button class="btn secondary" id="print">🖨️ Codekarten drucken</button><button class="btn warn" id="resetHost">Neue Runde erstellen</button></div><div class="panel"><h3>Spielablauf</h3><p>0–5 Min.: Rollen & Missionen · 5–15 Min.: Infektion · 15–25 Min.: Olympiade · 25–30 Min.: Abstimmung & Finale.</p><p class="muted">Alle Handys verwenden dieselbe Startzeit aus dem Link. Spielleiter: Finale moderieren und Punkte vergleichen.</p></div>`;
        document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(playerUrl(host.slots[+b.dataset.copy])));
        host.slots.forEach((s,i)=>qr(playerUrl(s),$('#qr'+i)));
        $('#print').onclick=()=>window.print();
        $('#resetHost').onclick=()=>{
            if(confirm('Neue Runde erstellen? Die bisherigen Links werden dadurch nicht ungültig, aber nicht mehr angezeigt.'))hostForm()
        }
    }

// Kopiert einen Link in die Zwischenablage.
function copy(s){
        if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast('Link kopiert')).catch(()=>prompt('Link kopieren:',s));
        else prompt('Link kopieren:',s)
    }

// Zeichnet einen QR-Code oder zeigt einen Ersatzhinweis an.
function qr(url,el){
        if(window.QRCode){
            new QRCode(el,{
                text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.L
            })
        }else{
            el.innerHTML='<span style="color:#111;font-size:12px">QR-Bibliothek nicht geladen. Link darunter verwenden.</span>'
        }
    }

// Zeigt das Formular zum Beitreten zu einer Runde.
function joinForm(){
        app.innerHTML=`<h1>🎟️ Stall-Einlass</h1><div class="panel"><p>Öffne deinen persönlichen Link oder füge deinen Code ein.</p><label>Persönlicher Link oder Code</label><input id="ticket" placeholder="Hier einfügen"><button class="btn" id="enter">Einlass prüfen</button><button class="btn secondary" id="back">Zurück</button></div>`;
        $('#back').onclick=landing;
        $('#enter').onclick=()=>{
            try{
                let raw=$('#ticket').value.trim();
                let code=raw.includes('#join=')?raw.split('#join=')[1]:raw;
                acceptTicket(unpack(code))
            }catch{
                toast('Ungültiger Spielcode')
            }
        }
    }

// Prüft den persönlichen Link und speichert den Spieler lokal.
function acceptTicket(t){
        if(t.v!==1||!t.room||!t.id||!roles[t.role]||!Number.isFinite(t.start))throw Error('Invalid ticket');
        if(player&&player.room!==t.room&&!confirm('Du hast bereits eine Runde gespeichert. Neue Runde beginnen?'))return;
        if(player&&player.room===t.room&&player.id!==t.id&&!confirm('Auf diesem Gerät ist bereits ein anderer Spieler angemeldet. Wechseln?'))return;
        player=player&&player.room===t.room&&player.id===t.id?player:{
            room:t.room,
            start:t.start,
            n:t.n||8,
            id:t.id,
            role:t.role,
            secret:t.secret,
            name:'',
            points:0,
            done:[],
            infected:t.role==='virus',
            infectedBy:null,
            infectedAt:null,
            infCount:0,
            usedTokens:[],
            vote:[],
            finalized:false,
            olympicDone:[],
            taskIndex:0
        };
        save(KEY,player);
        history.replaceState(null,'',base());
        renderPlayer()
    }

// Berechnet anhand der Uhrzeit, in welcher Spielphase wir sind.
function phase(){
        let elapsed=(Date.now()-player.start)/60000;
        return elapsed<0?-1:elapsed<5?0:elapsed<15?1:elapsed<25?2:elapsed<30?3:4
    }

// Übersetzt die Nummer einer Spielphase in ihren Namen.
function phaseLabel(p){
        return ['ROLLEN & MISSIONEN','ANSTECKUNG','STALL-OLYMPIADE','FINALE','SPIEL BEENDET'][p]||'STARTET BALD'
    }

// Zeigt die persönliche Spieleransicht inklusive Rolle und Punktestand.
function renderPlayer(){
        if(!player)return landing();
        let p=phase();
        if(!player.name){
            app.innerHTML=`<h1>🐮 Dein Stallausweis</h1><div class="panel"><label>Dein Kuhstall-Name</label><input id="name" maxlength="25" placeholder="z. B. Euter-007"><button class="btn" id="saveName">Weiter zur Geheimrolle</button></div>`;
            $('#saveName').onclick=()=>{
                let v=$('#name').value.trim();
                if(!v)return toast('Bitte einen Namen eingeben');
                player.name=v;
                save(KEY,player);
                renderPlayer()
            };
            return
        }let remaining=p===-1?player.start-Date.now():p===4?0:player.start+([5,15,25,30][p])*60000-Date.now();
        let m=Math.max(0,Math.ceil(remaining/1000));
        app.innerHTML=`<h1>🐮 ${esc(player.name)}</h1><div class="row"><span class="pill">${esc(player.id)}</span><span class="pill">⭐ ${player.points} Kuhpunkte</span></div><div class="panel"><div class="row"><span class="tag">${p===-1?'START IN':`PHASE ${p+1}`}</span><span id="clock" class="big">${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}</span></div><h2>${phaseLabel(p)}</h2><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,(Date.now()-player.start)/1800000*100))}%"></div></div><p class="muted">${p===-1?'Warte auf den gemeinsamen Start.':p===4?'Die Spielzeit ist vorbei.':'Alle Phasen wechseln automatisch nach der gemeinsamen Startzeit.'}</p></div><div class="panel"><div class="row"><h2>Geheime Rolle</h2><span class="tag">NUR FÜR DICH</span></div><div class="inner center"><div class="emoji">${roles[player.role].icon}</div><h2>${roles[player.role].label}</h2><p>${roles[player.role].desc}</p></div><p class="status">Infektionsstatus: <b>${player.infected?'🦠 INFIZIERT':'🐮 NICHT INFIZIERT'}</b></p></div><div id="content"></div><button class="btn secondary" id="help">📜 Regeln & Fairplay</button>`;
        $('#help').onclick=rules;
        let content=$('#content');
        if(p===-1){
            content.innerHTML='<div class="panel"><h2>Gleich geht es los!</h2><p>Halte deine Rolle geheim. Sprich mit den anderen, aber zeige niemandem diese Seite.</p></div>'
        }else if(p<=2){
            renderTasks(content,p)
        }else{
            renderFinal(content,p)
        }updateClock()
    }

// Wählt die Missionsliste passend zur Rolle beziehungsweise Infektion.
function taskPool(){
        return player.infected?tasks.virus:tasks[player.role]
    }

// Zeigt die aktuelle Mission und vergibt Punkte nach Bestätigung.
function renderTasks(content,p){
        let pool=taskPool(),
        idx=player.taskIndex%pool.length,
        task=pool[idx];
        let canInfect=player.infected&&p>=1&&player.infCount<2;
        content.innerHTML=`<div class="panel"><span class="tag">DEINE AKTUELLE MISSION</span><h2>🎯 Auftrag ${player.done.length+1}</h2><p class="lead">${esc(task[0])}</p><p class="success">+${task[1]} Kuhpunkte bei Erfolg</p><button class="btn" id="complete">✅ Mission geschafft</button><button class="btn secondary" id="skip">↪️ Mission überspringen</button><p class="muted">Missionen werden auf Vertrauensbasis bestätigt. Nicht dieselbe Aufgabe direkt zweimal werten.</p></div>${p>=1?`<div class="panel"><h2>🦠 Infektionsstation</h2>${player.infected?`<p>Du bist infiziert. ${canInfect?'Nach einer erfolgreichen Mission darfst du einen Infektionscode an eine andere Person übergeben.':'Deine verfügbaren Infektions-Übergaben sind aufgebraucht oder noch gesperrt.'}</p><p>Bestätigte Übergaben auf diesem Gerät: <b>${player.infCount}/2</b></p><button class="btn warn" id="infect" ${canInfect?'':'disabled'}>🦠 Infektions-QR anzeigen</button>`:'<p>Wenn dir jemand einen Infektionscode zeigt, scanne ihn mit der normalen Handykamera. Die Webseite öffnet sich und fragt nach deiner Zustimmung.</p>'}</div>`:''}${p===2?`<div class="panel"><h2>🏆 Stall-Olympiade</h2>${olympics.map((o,i)=>`<div class="card"><b>${esc(o[0])}</b><p>${esc(o[1])}</p><button class="btn secondary" data-ol="${i}" ${player.olympicDone.includes(i)?'disabled':''}>${player.olympicDone.includes(i)?'✓ Erledigt':'+50 Punkte für Teilnahme'}</button></div>`).join('')}</div>`:''}`;
        $('#complete').onclick=()=>{
            player.points+=task[1];
            player.done.push({
                task:task[0],time:Date.now()
            });
            player.taskIndex++;
            save(KEY,player);
            renderPlayer();
            toast('Mission geschafft! +'+task[1])
        };
        $('#skip').onclick=()=>{
            player.taskIndex++;
            save(KEY,player);
            renderPlayer()
        };
        if($('#infect'))$('#infect').onclick=showInfection;
        document.querySelectorAll('[data-ol]').forEach(b=>b.onclick=()=>{
            let i=+b.dataset.ol;if(!player.olympicDone.includes(i)){
                player.olympicDone.push(i);player.points+=50;save(KEY,player);renderPlayer()
            }
        })
    }

// Erzeugt einen QR-Code, mit dem andere Spieler infiziert werden können.
function showInfection(){
        let token={
            v:1,
            type:'infect',
            room:player.room,
            from:player.id,
            fromName:player.name,
            nonce:player.id+'-'+(player.infCount+1)+'-'+Math.random().toString(36).slice(2,8)
        };
        let url=base()+'#infect='+pack(token);
        $('#content').insertAdjacentHTML('afterbegin',`<div class="panel" id="infectionBox"><h2>🦠 Infektions-Übergabe</h2><p>Zeige den QR-Code nur nach einer erfolgreichen Mission. Die Zielperson scannt ihn und bestätigt auf ihrem Handy.</p><div id="infectionQR" class="qr"></div><button class="btn secondary" id="copyInfection">🔗 Infektionslink kopieren</button><button class="btn warn" id="confirmInfection">✓ Übergabe abgeschlossen</button><button class="btn secondary" id="cancelInfection">Abbrechen</button><p class="muted">Die Webseite kann nicht prüfen, ob die andere Person wirklich bestätigt hat. Bitte ehrlich spielen. Ein Code ist technisch kopierbar.</p></div>`);
        qr(url,$('#infectionQR'));
        $('#copyInfection').onclick=()=>copy(url);
        $('#confirmInfection').onclick=()=>{
            if(confirm('Hat die Zielperson den Code geöffnet und die Infektion bestätigt?')){
                player.infCount++;
                save(KEY,player);
                renderPlayer();
                toast('Übergabe notiert')
            }
        };
        $('#cancelInfection').onclick=renderPlayer();
        $('#infect').disabled=true
    }

// Verarbeitet einen gescannten Infektionscode.
function infectionIncoming(t){
        if(!player){
            history.replaceState(null,'',base());
            app.innerHTML='<h1>🦠 Infektionscode</h1><div class="panel"><p>Du musst zuerst deinen persönlichen Spielerlink öffnen, bevor du Infektionen empfangen kannst.</p><button class="btn" id="home">Zur Startseite</button></div>';
            $('#home').onclick=landing;
            return
        }history.replaceState(null,'',base());
        if(t.room!==player.room||t.from===player.id||!t.nonce){
            toast('Dieser Infektionscode passt nicht zu dir.');
            return renderPlayer()
        }if(phase()<1||phase()>2){
            toast('Infektionen sind nur von Minute 5 bis 25 erlaubt.');
            return renderPlayer()
        }if(player.infected||player.usedTokens.includes(t.nonce)){
            toast('Du bist bereits infiziert oder hast den Code benutzt.');
            return renderPlayer()
        }app.innerHTML=`<h1>🦠 INFEKTIONSALARM!</h1><div class="panel"><div class="emoji center">🚨</div><h2>${esc(t.fromName||t.from)} möchte dich infizieren!</h2><p>Eine andere Person hat ihre Infektionsmission abgeschlossen und zeigt dir ihren Code. Bestätige nur, wenn das wirklich passiert ist.</p><button class="btn warn" id="accept">Infektion bestätigen</button><button class="btn secondary" id="deny">Ablehnen</button></div>`;
        $('#accept').onclick=()=>{
            player.infected=true;
            player.infectedBy=t.from;
            player.infectedAt=Date.now();
            player.usedTokens.push(t.nonce);
            player.taskIndex=0;
            save(KEY,player);
            renderPlayer();
            toast('Du bist jetzt infiziert!')
        };
        $('#deny').onclick=renderPlayer
    }

// Zeigt Abstimmung und Abschluss der Runde.
function renderFinal(content,p){
        let choices=host&&host.id===player.room?host.slots.map(s=>s.id):Array.from({
            length:player.n||8
        },(_,i)=>'KUH-'+String(i+1).padStart(2,'0'));
        let need=player.n>=8?2:1;
        content.innerHTML=`<div class="panel"><h2>🕵️ Der finale Verdacht</h2><p>Wer war <b>von Anfang an</b> Patient Null? Wähle ${need} ${need===1?'Person':'Personen'}. Später Infizierte zählen nicht.</p><p class="muted">Die Spielleitung kann bei 5–7 Spielern eine, bei 8–10 Spielern zwei ursprüngliche Virusrollen vergeben haben. Falls du die Spielerzahl nicht kennst, frag die Spielleitung.</p>${choices.map(id=>`<button class="choice ${player.vote.includes(id)?'selected':''}" data-vote="${id}">${player.vote.includes(id)?'☑':'☐'} ${id}${id===player.id?' (du)':''}</button>`).join('')}<button class="btn" id="saveVote" ${player.vote.length!==need?'disabled':''}>🔒 Verdacht speichern</button></div><div class="panel"><h2>🏁 Dein Ergebnis</h2><p>⭐ <b>${player.points} Kuhpunkte</b> · ${player.done.length} erledigte Missionen · ${player.infCount} Infektionsübergaben</p><p>Ursprüngliche Rolle: <b>${roles[player.role].label}</b></p><p>Infektionsstatus: <b>${player.infected?'Infiziert':'Nicht infiziert'}</b></p><button class="btn secondary" id="reveal">📣 Meine Rolle beim Finale zeigen</button></div>`;
        document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{
            let id=b.dataset.vote;player.vote=player.vote.includes(id)?player.vote.filter(x=>x!==id):[...player.vote,id].slice(-need);save(KEY,player);renderPlayer()
        });
        $('#saveVote').onclick=()=>{
            player.finalized=true;
            save(KEY,player);
            toast('Verdacht lokal gespeichert!')
        };
        $('#reveal').onclick=()=>{
            app.innerHTML=`<h1>🎉 STALLFREIGABE 2026</h1><div class="panel center"><div class="emoji">${roles[player.role].icon}</div><h2>${roles[player.role].label}</h2><p>${esc(player.name)} · ${esc(player.id)}</p><div class="big">⭐ ${player.points}</div><p>Ursprüngliche Rolle: ${roles[player.role].label}</p><p>${player.infected&&player.role!=='virus'?'Später infiziert!':player.role==='virus'?'Von Anfang an infiziert!':'Nicht infiziert.'}</p><p>Mein Verdacht: ${player.vote.map(esc).join(', ')||'kein Tipp'}</p><button class="btn secondary" id="return">Zur Übersicht</button></div>`;
            $('#return').onclick=renderPlayer
        }
    }

// Zeigt die Spielregeln an.
function rules(){
        app.innerHTML=`<h1>📜 Stallgesetz</h1><div class="panel"><h2>So wird gespielt</h2><p><b>1.</b> Jeder erhält genau einen persönlichen Spielerlink und hält seine Rolle geheim.</p><p><b>2.</b> Missionen werden in der echten Gruppe erfüllt. Erledigte Missionen selbst bestätigen; keine Doppelwertung derselben Aktion.</p><p><b>3.</b> Zwischen Minute 5 und 25 dürfen Infizierte nach erfolgreicher Mission bis zu zwei Infektionsübergaben vornehmen. Zielperson scannt den QR-Code und bestätigt.</p><p><b>4.</b> Infizierte bleiben für die Wertung in ihrer ursprünglichen Rolle. Ziel der Detektive und Stallbewohner: Patient Null finden.</p><p><b>5.</b> In Minute 25–30 werden die ursprünglichen Infizierten gewählt. Danach zeigen alle ihre Rollen und Punkte. Das Team der Stallbewohner gewinnt, wenn alle ursprünglichen Infizierten korrekt identifiziert wurden. Sonst gewinnt das Virus-Team.</p><p><b>6.</b> Die Person mit den meisten Kuhpunkten wird Oberkuh 2026. Bei Gleichstand: gemeinsames MUH-Duell.</p><p><b>7.</b> Niemand muss Alkohol trinken. Kleine freiwillige Schlücke, alkoholfreie Alternativen und lustige Ersatzaufgaben sind gleichwertig. Kein Trinkzwang und keine Aufgaben, die andere unter Druck setzen.</p><p><b>8.</b> Fairplay: QR-Codes sind nicht fälschungssicher, die Spielleitung vergleicht am Ende die Ergebnisse. Browserdaten nicht während der Runde löschen.</p><button class="btn" id="return">Zurück zum Spiel</button></div>`;
        $('#return').onclick=renderPlayer
    }

// Aktualisiert den sichtbaren Countdown.
function updateClock(){
        let e=$('#clock');
        if(!e||!player)return;
        let p=phase(),
        end=p===-1?player.start:p===4?Date.now():player.start+[5,15,25,30][p]*60000;
        let sec=Math.max(0,Math.ceil((end-Date.now())/1000));
        e.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
        if(window._phase!==undefined&&window._phase!==p){
            window._phase=p;
            renderPlayer()
        }else window._phase=p
    } setInterval(()=>{
        if($('#clock'))updateClock()
    },1000);
    // Reagiert auf persönliche Beitrittslinks und Infektionslinks.

// Reagiert auf persönliche Beitrittslinks und Infektionslinks.
function route(){
        let hash=location.hash;
        if(hash.startsWith('#join=')){
            try{
                acceptTicket(unpack(hash.slice(6)))
            }catch{
                history.replaceState(null,'',base());
                joinForm();
                toast('Ungültiger Spielerlink')
            }return
        }if(hash.startsWith('#infect=')){
            try{
                infectionIncoming(unpack(hash.slice(8)))
            }catch{
                history.replaceState(null,'',base());
                landing();
                toast('Ungültiger Infektionscode')
            }return
        }landing()
    } route();
    window.addEventListener('hashchange',route);
</script>
